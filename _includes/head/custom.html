<!-- Language toggle styles -->
<style>
  .masthead__menu {
    position: relative;
    padding-right: 6.5rem;
  }

  .masthead__controls {
    position: absolute;
    top: 50%;
    right: 0;
    z-index: 12;
    display: inline-flex;
    align-items: center;
    transform: translateY(-50%);
  }

  .lang-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 0;
    padding: 3px;
    border: 1.5px solid rgba(0,0,0,0.18);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.88);
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
    transition: border-color 0.2s;
    overflow: hidden;
  }

  .lang-toggle-btn:hover {
    border-color: rgba(0,0,0,0.35);
  }

  .lang-opt {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 28px;
    padding: 0 10px;
    border-radius: 16px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: background 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
    color: #8a9298;
    background: transparent;
  }

  .lang-opt--active {
    color: #fff;
    background: linear-gradient(135deg, #15868d, #0f666b);
    box-shadow: 0 2px 8px rgba(15, 102, 107, 0.28);
  }

  /* In the sticky masthead, match the nav link color */
  .masthead .lang-toggle-btn {
    border-color: rgba(0,0,0,0.13);
    background: rgba(255, 255, 255, 0.92);
  }

  .masthead .lang-toggle-btn:hover {
    border-color: rgba(0,0,0,0.28);
  }

  @media (max-width: 48em) {
    .masthead__menu {
      padding-right: 5.2rem;
    }

    .masthead__controls {
      right: 0.15rem;
    }

    .lang-opt {
      min-width: 28px;
      height: 26px;
      padding: 0 8px;
      font-size: 0.7rem;
    }
  }
</style>
<!-- end custom head snippets -->
